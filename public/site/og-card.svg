<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FrogAlert social preview</title>
  <desc id="desc">FrogAlert wordmark above a long edge-to-edge LED nametag showing COP DETECTED.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130d"/>
      <stop offset="0.58" stop-color="#0b1e15"/>
      <stop offset="1" stop-color="#102b1e"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26382e"/>
      <stop offset="0.5" stop-color="#101a14"/>
      <stop offset="1" stop-color="#050906"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#d8ff80" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="matrix" width="24.181818" height="24.181818" patternUnits="userSpaceOnUse">
      <circle cx="12.090909" cy="12.090909" r="3.4" fill="#213328"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".58"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="300" r="350" fill="#b7f34a" opacity=".05"/>
  <path d="M0 544 C210 480 358 608 590 535 S950 468 1200 548 V630 H0Z" fill="#b7f34a" opacity=".035"/>

  <g transform="translate(74 52)">
    <g aria-hidden="true">
      <path d="M5 19 C5 6 15 0 27 0 C40 0 49 7 49 19 C49 32 39 41 27 41 C15 41 5 32 5 19Z" fill="none" stroke="#b7f34a" stroke-width="4"/>
      <circle cx="17" cy="16" r="3.5" fill="#d8ff80"/>
      <circle cx="37" cy="16" r="3.5" fill="#d8ff80"/>
      <path d="M18 29 Q27 35 36 29" fill="none" stroke="#b7f34a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="67" y="31" fill="#f2eedf" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="800" letter-spacing="3">FROGALERT.ORG</text>
  </g>

  <g transform="translate(74 171)">
    <text x="0" y="0" fill="#f2eedf" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="102" font-weight="850" letter-spacing="-7">FROG</text>
    <text x="294" y="0" fill="#b7f34a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="102" font-weight="850" letter-spacing="-7">ALERT</text>
    <text x="0" y="62" fill="#f2eedf" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="720">Bluetooth alerts on a nametag.</text>
    <text x="0" y="108" fill="#9bb1a2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1">CH582M  ·  11×44 LEDS  ·  PASSIVE BLE  ·  LOCAL ONLY</text>
  </g>

  <g transform="translate(805 66)">
    <rect width="321" height="62" rx="12" fill="#102b1e" stroke="#b7f34a" stroke-opacity=".3"/>
    <circle cx="30" cy="31" r="6" fill="#b7f34a" filter="url(#glow)"/>
    <text x="50" y="27" fill="#d8ff80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="800" letter-spacing="1">NAMETAG + BT COUNTER</text>
    <text x="50" y="47" fill="#9bb1a2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Open firmware. No cloud log.</text>
  </g>

  <g transform="rotate(-1 600 438)" filter="url(#shadow)">
    <path d="M559 319 C559 292 576 276 600 276 C624 276 641 292 641 319" fill="none" stroke="#f2eedf" stroke-opacity=".15" stroke-width="17" stroke-linecap="round"/>
    <rect id="badge-shell" x="54" y="294" width="1092" height="270" rx="42" fill="url(#badge)" stroke="#52685a" stroke-width="2"/>
    <rect x="68" y="296" width="1064" height="266" rx="38" fill="#010302" stroke="#24362b" stroke-width="2"/>
    <rect id="badge-matrix" x="68" y="296" width="1064" height="266" rx="38" fill="url(#matrix)"/>
    <g fill="#d8ff80" filter="url(#glow)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="900" text-anchor="middle">
      <text x="600" y="452" font-size="72" letter-spacing="6">COP DETECTED</text>
    </g>
  </g>

  <rect x="74" y="590" width="1052" height="1" fill="#d8ff80" opacity=".16"/>
  <text x="74" y="614" fill="#72877a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">EXPERIMENTAL FIRMWARE · HARDWARE TESTING IN PROGRESS</text>
</svg>
